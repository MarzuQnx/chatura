<div id="bioModal" class="fixed inset-0 z-50 opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-xs" onclick="if(window.closeBioModal){closeBioModal();}else if(window.closeAuthorModal){closeAuthorModal();}"></div>
    
    <div class="modal-content bg-white rounded-2xl max-w-4xl w-full relative z-10 shadow-2xl overflow-hidden border border-gray-100 flex flex-col md:flex-row transform scale-95 translateY(15px) transition-all duration-300 max-h-[90vh] md:max-h-[85vh]">
        <button onclick="if(window.closeBioModal){closeBioModal();}else if(window.closeAuthorModal){closeAuthorModal();}" class="absolute top-4 right-4 bg-white/80 p-1.5 rounded-full text-gray-500 hover:text-gray-800 shadow-xs border border-gray-100 transition z-20" aria-label="Close modal">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <!-- Sticky Left Column Profile Card -->
        <div class="w-full md:w-1/3 bg-gray-50 p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-100 shrink-0 text-center">
            <img id="modal-img" src="" alt="" class="w-36 h-48 rounded-xl object-cover shadow-md border-4 border-white mb-4 bg-gray-200">
            <h3 id="modal-name" class="text-xl font-bold text-gray-900 leading-tight"></h3>
            <p id="modal-title" class="text-xs font-bold text-[#004D34] uppercase tracking-wide mt-1 mb-2"></p>
            <p id="modal-location" class="text-xs text-gray-400 flex items-center gap-1 mb-6"><i data-lucide="map-pin" class="w-3 h-3"></i> <span></span></p>
            
            <div class="flex gap-2.5 w-full">
                <a id="modal-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 bg-white border border-gray-200 rounded-lg py-2 text-xs font-semibold text-gray-600 hover:text-emerald-900 hover:border-emerald-700 flex justify-center items-center gap-1 transition">
                    <i data-lucide="linkedin" class="w-3.5 h-3.5"></i> LinkedIn
                </a>
                <a id="modal-email" href="#" class="flex-1 bg-white border border-gray-200 rounded-lg py-2 text-xs font-semibold text-gray-600 hover:text-emerald-900 hover:border-emerald-700 flex justify-center items-center gap-1 transition">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i> Email
                </a>
            </div>
        </div>

        <!-- Scrollable Right Column Content Room -->
        <div class="w-full md:w-2/3 p-8 overflow-y-auto custom-scrollbar flex flex-col gap-6">
            <div>
                <h4 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-2" data-i18n="people.modal_bio">Biography</h4>
                <p id="modal-bio" class="text-gray-600 text-sm leading-relaxed"></p>
            </div>

            <div>
                <h4 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-2" data-i18n="people.modal_expertise">Expertise & Practice Focus</h4>
                <div id="modal-expertise" class="flex flex-wrap gap-1.5"></div>
            </div>

            <div>
                <h4 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-3" data-i18n="people.modal_experience">Representative Experience</h4>
                <ul id="modal-experience" class="space-y-2 text-xs text-gray-600"></ul>
            </div>

            <div>
                <h4 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-3" data-i18n="people.modal_publications">Publications & Insights</h4>
                <div id="modal-publications" class="grid sm:grid-cols-2 gap-3"></div>
            </div>
        </div>
    </div>
</div>
