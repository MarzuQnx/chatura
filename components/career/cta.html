<!-- APPLY FORM — 2-Column -->
<section id="apply-form" class="py-20 bg-gray-800 border-t border-gray-100 scroll-mt-24">
    <div class="container mx-auto px-6 max-w-4xl">
        <div class="bg-white p-8 md:p-12 rounded-2xl border border-gray-200 shadow-xs">
            <div class="text-center mb-10">
                <h2 class="text-2xl font-serif font-bold text-gray-950" data-i18n="career.apply_title">Submit
                    Your Application</h2>
                <p class="text-xs text-gray-500 mt-2" data-i18n="career.apply_desc">Complete the form below
                    along with your latest CV.</p>
            </div>
            <form class="text-xs" onsubmit="handleJobSubmit(event)">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-5">
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_name">Full Name *</label><input type="text"
                                data-i18n-placeholder="career.form_name_placeholder"
                                placeholder="Enter your full name"
                                class="w-full bg-white border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-700 transition shadow-2xs"
                                required></div>
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_email">Business / Personal Email *</label><input
                                type="email" data-i18n-placeholder="career.form_email_placeholder"
                                placeholder="name@domain.com"
                                class="w-full bg-white border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-700 transition shadow-2xs"
                                required></div>
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_phone">Phone Number (WhatsApp) *</label><input type="tel"
                                data-i18n-placeholder="career.form_phone_placeholder" placeholder="+62 8..."
                                class="w-full bg-white border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-700 transition shadow-2xs"
                                required></div>
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_position">Position Applied For *</label><select
                                id="positionDropdown"
                                class="w-full bg-white border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-700 transition shadow-2xs"
                                required></select></div>
                    </div>
                    <div class="space-y-5">
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_cv">Upload CV / Resume (PDF, max 5MB) *</label><input
                                type="file" accept=".pdf"
                                class="w-full bg-white border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:border-emerald-700 transition file:bg-gray-100 file:border-0 file:rounded-md file:px-3 file:py-1 file:text-xs file:font-semibold file:text-gray-700 hover:file:bg-gray-200"
                                required></div>
                        <div><label class="block font-bold text-gray-700 mb-1.5"
                                data-i18n="career.form_message">Additional Message / Cover
                                Letter</label><textarea rows="6"
                                data-i18n-placeholder="career.form_message_placeholder"
                                placeholder="Tell us why you'd be a great fit..."
                                class="w-full bg-white border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:border-emerald-700 transition shadow-2xs"></textarea>
                        </div>
                    </div>
                </div>
                <div class="mt-8 text-center"><button type="submit"
                        class="bg-[#004D34] text-white px-8 py-3.5 rounded-lg font-bold hover:bg-[#003322] transition shadow-xs inline-flex items-center gap-2"><span
                            data-i18n="career.submit_btn">Submit Application</span><i data-lucide="send"
                            class="w-4 h-4"></i></button></div>
            </form>
        </div>
    </div>
</section>
