<!-- FEATURED AVAILABLE JOBS & OPEN POSITIONS -->
<section id="featured-jobs" class="py-20 bg-white border-b border-gray-100">
    <div class="container mx-auto px-6">
        <div class="reveal-up flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-12">
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-emerald-700"
                    data-i18n="career.featured_label">Available Jobs</span>
                <h2 class="text-2xl sm:text-3xl font-serif mt-2" data-i18n="career.featured_title">Featured
                    Opportunities</h2>
            </div>
            <a href="#open-positions"
                class="text-sm text-[#004D34] font-semibold hover:underline flex items-center gap-1 whitespace-nowrap"
                data-i18n="career.view_all_jobs">View all jobs <i data-lucide="arrow-right"
                    class="w-3 h-3"></i></a>
        </div>
        <div id="featuredJobsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
    </div>
</section>

<!-- OPEN POSITIONS -->
<section id="open-positions" class="py-20 bg-white border-b border-gray-100 scroll-mt-24">
    <div class="container mx-auto px-6">
        <div class="reveal-up flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-12">
            <div><span class="text-xs font-bold uppercase tracking-widest text-emerald-700"
                    data-i18n="career.positions_label">Opportunities</span>
                <h2 class="text-2xl sm:text-3xl font-serif mt-2" data-i18n="career.positions_title">Open
                    Positions</h2>
            </div>
            <div class="flex flex-wrap gap-1.5" role="tablist" id="jobFilterWrap">
                <button type="button" data-filter="all" aria-selected="true"
                    class="job-tab-btn px-4 py-1.5 border border-gray-200 bg-white text-xs font-medium rounded-full text-gray-700 hover:border-emerald-700 transition"
                    data-i18n="career.filter_all">All Departments</button>
                <button type="button" data-filter="tax" aria-selected="false"
                    class="job-tab-btn px-4 py-1.5 border border-gray-200 bg-white text-xs font-medium rounded-full text-gray-700 hover:border-emerald-700 transition"
                    data-i18n="career.filter_tax">Tax</button>
                <button type="button" data-filter="finance" aria-selected="false"
                    class="job-tab-btn px-4 py-1.5 border border-gray-200 bg-white text-xs font-medium rounded-full text-gray-700 hover:border-emerald-700 transition"
                    data-i18n="career.filter_finance">Finance</button>
                <button type="button" data-filter="risk" aria-selected="false"
                    class="job-tab-btn px-4 py-1.5 border border-gray-200 bg-white text-xs font-medium rounded-full text-gray-700 hover:border-emerald-700 transition"
                    data-i18n="career.filter_risk">Risk Management</button>
                <button type="button" data-filter="legal" aria-selected="false"
                    class="job-tab-btn px-4 py-1.5 border border-gray-200 bg-white text-xs font-medium rounded-full text-gray-700 hover:border-emerald-700 transition"
                    data-i18n="career.filter_legal">Legal</button>
            </div>
        </div>
        <div id="positionsContainer" class="grid gap-4 max-w-4xl mx-auto"></div>
    </div>
</section>
