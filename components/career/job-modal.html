<!-- JOB MODAL -->
<div id="jobModal"
    class="fixed inset-0 z-50 opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4"
    role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-xs" onclick="closeJobModal()"></div>
    <div
        class="modal-body w-full max-w-2xl max-h-[85vh] bg-white rounded-2xl shadow-2xl flex flex-col transform scale-95 opacity-0 transition-all duration-300 overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-start shrink-0">
            <div>
                <span id="modalDept"
                    class="text-[10px] font-bold uppercase tracking-wider bg-emerald-50 text-emerald-800 px-2.5 py-0.5 rounded-full inline-block mb-2"></span>
                <h3 id="modalTitle" class="text-xl font-bold font-serif text-gray-950 leading-tight"></h3>
                <div class="flex gap-4 text-xs text-gray-400 mt-2">
                    <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                        <span id="modalLocation"></span></span>
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> <span
                            id="modalType"></span></span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button
                    class="text-gray-400 hover:text-gray-700 p-1.5 rounded-lg border border-gray-100 transition"
                    data-i18n-title="join.bookmark" title="Bookmark"><i data-lucide="bookmark"
                        class="w-4 h-4"></i></button>
                <button
                    class="text-gray-400 hover:text-gray-700 p-1.5 rounded-lg border border-gray-100 transition"
                    data-i18n-title="join.share" title="Share"><i data-lucide="share-2"
                        class="w-4 h-4"></i></button>
                <button onclick="closeJobModal()" aria-label="Close"
                    class="text-gray-400 hover:text-gray-700 p-1.5 rounded-lg border border-gray-100 transition"><i
                        data-lucide="x" class="w-5 h-5"></i></button>
            </div>
        </div>
        <div class="p-6 overflow-y-auto flex-1 space-y-6 text-xs text-gray-600 leading-relaxed">
            <div>
                <h4 class="font-bold text-gray-950 mb-2 text-sm" data-i18n="career.about_role">About the Role
                </h4>
                <p id="modalAbout" class="text-gray-600"></p>
            </div>
            <div>
                <h4 class="font-bold text-gray-950 mb-2 text-sm" data-i18n="career.what_do">What You'll Do</h4>
                <ul id="modalTasks" class="list-disc pl-4 space-y-1.5"></ul>
            </div>
            <div>
                <h4 class="font-bold text-gray-950 mb-2 text-sm" data-i18n="career.what_bring">What You'll Bring
                </h4>
                <ul id="modalRequirements" class="list-disc pl-4 space-y-1.5"></ul>
            </div>
            <div class="bg-emerald-50 rounded-xl p-5 border border-emerald-100">
                <h4 class="font-bold text-gray-950 mb-3 text-sm" data-i18n="career.drawer_benefits">Key Benefits
                </h4>
                <ul class="text-xs text-gray-600 space-y-1.5">
                    <li class="flex items-center gap-2"><i data-lucide="check"
                            class="w-3 h-3 text-emerald-700 shrink-0"></i> <span
                            data-i18n="career.drawer_benefit_1">Health insurance coverage</span></li>
                    <li class="flex items-center gap-2"><i data-lucide="check"
                            class="w-3 h-3 text-emerald-700 shrink-0"></i> <span
                            data-i18n="career.drawer_benefit_2">Performance bonus program</span></li>
                    <li class="flex items-center gap-2"><i data-lucide="check"
                            class="w-3 h-3 text-emerald-700 shrink-0"></i> <span
                            data-i18n="career.drawer_benefit_3">Professional development budget</span></li>
                </ul>
            </div>
            <div>
                <h4 class="font-bold text-gray-950 mb-3 text-sm" data-i18n="career.drawer_similar">Similar Roles
                </h4>
                <div id="modalSimilar" class="space-y-2"></div>
            </div>
        </div>
        <div class="p-6 border-t border-gray-100 bg-gray-50 flex items-center gap-3 shrink-0">
            <button id="modalApplyBtn"
                class="flex-1 bg-[#004D34] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#003322] transition shadow-xs text-center"
                data-i18n="career.apply_now">Apply Now</button>
        </div>
    </div>
</div>
