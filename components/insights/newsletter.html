<section class="py-20 bg-gray-100 border-t border-gray-100">
    <div class="container mx-auto px-6 max-w-4xl">
        <div
            class="reveal-up bg-white rounded-2xl border border-gray-200 p-10 md:p-14 text-center newsletter-block">
            <div
                class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto mb-6">
                <i data-lucide="mail" class="w-6 h-6"></i></div>
            <h3 class="text-2xl font-serif font-bold text-gray-950 mb-3" data-i18n="insights.newsletter_title">
                Receive Strategic Briefings in Your Inbox</h3>
            <p class="text-gray-500 text-sm mb-8 max-w-lg mx-auto leading-relaxed"
                data-i18n="insights.newsletter_desc">
                Join international executives who receive prioritized summaries regarding regulatory shifts and
                market intelligence.
            </p>
            <form class="flex max-w-md mx-auto shadow-md"
                onsubmit="event.preventDefault(); this.querySelector('button').textContent='Subscribed \u2713'; this.querySelector('button').classList.add('bg-emerald-700');">
                <label for="briefing-email" class="sr-only">Business Email</label>
                <input id="briefing-email" type="email" autocomplete="email" placeholder="Enter corporate email"
                    class="w-full bg-white text-xs px-4 py-3 border border-gray-200 border-r-0 rounded-l-lg focus:outline-none focus:border-emerald-700 transition"
                    required>
                <button type="submit"
                    class="bg-[#004D34] text-white text-xs px-6 py-3 rounded-r-lg font-semibold hover:bg-[#003322] transition whitespace-nowrap">
                    <span data-i18n="insights.subscribe">Subscribe</span>
                </button>
            </form>
            <p class="text-[10px] text-gray-400 mt-4">No spam. Privacy-first.</p>
        </div>
    </div>
</section>
