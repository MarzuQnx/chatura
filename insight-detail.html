<body class="bg-white text-gray-800 font-sans antialiased">
    <a href="#main-content" class="skip-link" data-i18n="nav.skip">Skip to main content</a>

    <!-- Core Component Loader & Page Initializer -->
    <script src="assets/js/core/component-loader.js"></script>
    <script src="assets/js/core/PageLoader.js"></script>

    <script>
        if (!window.openAuthorModal) {
            window.openAuthorModal = function(id) {
                var modal = document.getElementById('bioModal') || document.getElementById('authorModal');
                if (modal) { modal.classList.add('active'); document.body.style.overflow = 'hidden'; }
            };
        }
        if (!window.closeAuthorModal) {
            window.closeAuthorModal = function() {
                var modal = document.getElementById('bioModal') || document.getElementById('authorModal');
                if (modal) { modal.classList.remove('active'); document.body.style.overflow = ''; }
            };
        }
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
